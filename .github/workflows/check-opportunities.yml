name: Check HomeShare opportunities

on:
  repository_dispatch:
    types: [check-opportunities]
  schedule:
    # Backup only — GitHub's schedule trigger is unreliable for this repo in
    # practice (observed averaging ~2h between runs instead of 15m), so the
    # primary trigger is an external cron service hitting the GitHub API's
    # repository_dispatch endpoint. See README for setup.
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-opportunities
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync to latest (avoid stale-checkout race)
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run opportunity check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_opportunities.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_opportunities.json
          git diff --staged --quiet || git commit -m "Update seen opportunities"
          git push
